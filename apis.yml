aid: clerio-vision
name: Clerio Vision
description: 'Clerio Vision is a development-stage ophthalmic medical device company
  based in Rochester, New York, commercializing LIRIC (Laser Induced Refractive Index
  Change) — a non-invasive femtosecond-laser platform, licensed from the University
  of Rochester''s Center for Visual Science, that alters the refractive index of corneal
  tissue and of polymer optics without cutting or removing material. The company applies
  LIRIC across four ophthalmic segments: multifocal soft contact lenses for presbyopia,
  myopia control in children, post-implant intraocular lens (IOL) optimization after
  cataract surgery, and incisionless corneal refractive correction. Clerio has raised
  roughly $40 million from Safar Partners, Armory Square Ventures, Topmark Partners,
  Proxima Ventures, Atma Capital, Hegemon Capital and the National Science Foundation,
  and holds more than 90 patents across over 30 families. Its products are lasers,
  optics and lenses rather than software; the company publishes a single-page marketing
  and investor website and operates no public developer program, API, SDK or developer
  portal.'
